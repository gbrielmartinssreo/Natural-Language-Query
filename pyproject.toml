[project]
name = "nlq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gabriel Martins", email = "gbmmorais50@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "custom-tree>=1.7",
    "deepagents>=0.7.23",
    "fastapi[standard]>=0.142.2",
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "langchain-openrouter>=0.2.9",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "xldetect>=1.0.1",
]

[project.scripts]
nlq = "nlq.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "nlq.api:app"
