name: build

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    tags:
      - 'v*'

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest

    env:
      API_SELECT: groq
      GROQ_API_KEY: test
      OPENROUTER_API_KEY: test
      OPENAI_API_KEY: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Executar testes
        run: uv run python -m unittest discover -s tests -v

  build:
    name: Build (${{ matrix.artifact }})
    needs: test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: NLQ-linux-x86_64

          - os: windows-latest
            artifact: NLQ-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Empacotar com PyInstaller
        run: uv run --with pyinstaller pyinstaller --noconfirm --clean nlq.spec

      - name: Adicionar configuração e planilhas de exemplo
        shell: bash
        run: |
          cp .env.example dist/NLQ/.env.example
          cp -r sheets dist/NLQ/sheets

      - name: Compactar (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd dist
          zip -r "${{ matrix.artifact }}.zip" NLQ

      - name: Compactar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/NLQ `
            -DestinationPath "dist/${{ matrix.artifact }}.zip" `
            -Force

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
