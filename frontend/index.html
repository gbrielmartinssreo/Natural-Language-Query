<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231f3a5f'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>A</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <!-- Barra lateral -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-badge">A</div>
          <div class="brand-text">
            <div class="brand-name">Assistente</div>
          </div>
        </div>
        <div class="chat-list" id="chatList"></div>
      </div>

      <div class="sidebar-bottom">
        <div class="status-row">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">conectando…</span>
        </div>
        <button class="clear-chat" id="clearHistory">Limpar histórico</button>
        <button class="clear-chat" id="themeToggle">Alternar tema</button>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <!-- Área principal -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title">
          <div class="brand-badge small">A</div>
          <span>Assistente</span>
        </div>
        <div class="topbar-right">
          <span class="planilha-chip" id="planilhaChip" title="Planilha consultada pelo agente">
            <span class="dot planilha"></span>
            <span id="planilhaNome"></span>
          </span>
          <span class="topbar-status" id="topbarStatus"></span>
        </div>
      </header>

      <div class="scroll">
        <div class="welcome" id="welcome">
          <div class="welcome-logo">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="M8 10h8M8 14h5"/></svg>
          </div>
          <h1>Como posso ajudar hoje?</h1>
          <p>Escreva sua pergunta abaixo para começar.</p>
          <div class="suggestions" id="suggestions"></div>
        </div>
        <div class="chat" id="chat"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Digite sua mensagem…"></textarea>
          <button class="send" id="sendBtn" disabled aria-label="Enviar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </div>
        <div class="composer-note">As respostas podem conter erros. Verifique as informações importantes.</div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
